name: Générer Ma Boutique APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          unzip -q MaBoutique_APK_Project.zip -d projet
          echo "Projet décompressé"
          find projet -maxdepth 3 -type f | head -50

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        working-directory: projet/MaBoutique_APK_Project
        run: |
          gradle assembleDebug

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: MaBoutique-APK
          path: projet/MaBoutique_APK_Project/app/build/outputs/apk/debug/app-debug.apk
